# ===========================================================================
# VOCABULARY TEMPLATE
# ===========================================================================
# This file is a template for creating a standalone LinkML controlled
# vocabulary. It is not a metadata schema — it contains only a header
# and enum definitions. All LinkML generators (gen-owl, gen-doc, Python
# SKOS script) work on vocabulary-only YAML files.
#
# Instructions:
#   1. Copy this file and rename it to your vocabulary name
#   2. Fill in the header fields
#   3. Define your concepts in the enums section
#   4. Push to GitHub — the workflow will automatically generate SKOS,
#      validate, and deploy documentation
# ===========================================================================

# ---------------------------------------------------------------------------
# SCHEMA HEADER
# ---------------------------------------------------------------------------

# Persistent URI for this vocabulary — must match your w3id.org namespace
id: https://w3id.org/chemical-exposome/vocabulary/my-vocabulary

# Machine-readable name — no spaces, use hyphens
name: my-vocabulary

# Human-readable title
title: My Controlled Vocabulary

# Description — explain what this vocabulary covers and who it is for
description: >-
  A controlled vocabulary for [describe the domain]. This vocabulary
  provides a standardised set of terms for [describe the use case].
  Developed within the [project name] project.

# Version — use semantic versioning (MAJOR.MINOR.PATCH)
version: "1.0.0"

# License URI — CC-BY 4.0 recommended for open vocabularies
license: https://creativecommons.org/licenses/by/4.0/

# Creator ORCID — the person who created this vocabulary
created_by: https://orcid.org/0000-0000-0000-0000

# Date the vocabulary was first created (ISO 8601)
created_on: "2026-01-01T00:00:00Z"

# Date of last update (ISO 8601) — update this on every release
last_updated_on: "2026-01-01T00:00:00Z"

# Person who last modified the vocabulary
modified_by: https://orcid.org/0000-0000-0000-0000

# Contributors — list of ORCID URIs
# contributors:
#   - https://orcid.org/0000-0000-0000-0001
#   - https://orcid.org/0000-0000-0000-0002

# CRediT contributor roles (human-readable)
# See https://credit.niso.org/contributor-roles/
comments:
  - >-
    CRediT contributor roles (https://credit.niso.org/contributor-roles/):
    Conceptualization: [Name] (https://orcid.org/XXXX-XXXX-XXXX-XXXX);
    Data curation: [Name] (https://orcid.org/XXXX-XXXX-XXXX-XXXX)

# Related resources — DOI of deposited vocabulary, project website etc.
see_also:
  - https://doi.org/10.5281/zenodo.XXXXXXX   # Zenodo DOI — add after deposit
  - https://www.your-project-website.eu

# Versioning annotations
annotations:
  schema_status:
    tag: schema_status
    value: draft    # draft | review | stable | deprecated

  latest_editors_draft:
    tag: latest_editors_draft
    value: "https://github.com/your-username/your-repo/blob/main/vocabulary/my-vocabulary.yaml"

  changelog:
    tag: changelog
    value: "https://github.com/your-username/your-repo/blob/main/CHANGELOG.md"

  funding:
    tag: funding
    value: >-
      This work was supported by [funding body] under grant agreement No [grant number].

# ---------------------------------------------------------------------------
# PREFIXES
# ---------------------------------------------------------------------------
# Define namespace prefixes used in meaning: URIs
# Add any external vocabularies you reference

prefixes:
  linkml: https://w3id.org/linkml/
  cenvo: https://w3id.org/chemical-exposome/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  # Add your own prefix here:
  # myv: https://w3id.org/chemical-exposome/vocabulary/my-vocabulary/

# Default prefix for minted URIs — terms will get cenvo: URIs
# Change to your vocabulary-specific prefix if minting new terms
default_prefix: cenvo

# Required import for LinkML types
imports:
  - linkml:types

# ---------------------------------------------------------------------------
# SUBSETS
# ---------------------------------------------------------------------------
# Define subsets to group concepts for specific purposes
# These map to skos:Collection in SKOS output

subsets:
  # Example subset — delete or replace with your own
  domain_atmospheric:
    description: Concepts relevant for atmospheric monitoring

# ---------------------------------------------------------------------------
# ENUMS (CONTROLLED VOCABULARY)
# ---------------------------------------------------------------------------
# Each enum becomes a skos:ConceptScheme
# Each permissible value becomes a skos:Concept
#
# Key properties:
#   is_a:           → skos:broader (parent concept)
#   description:    → skos:definition
#   aliases:        → skos:altLabel
#   comments:       → skos:scopeNote
#   meaning:        → skos:exactMatch + identity (adopts external URI)
#   exact_mappings: → skos:exactMatch (maps to external, keeps own URI)
#   broad_mappings: → skos:broadMatch
#   narrow_mappings:→ skos:narrowMatch

enums:

  # -------------------------------------------------------------------------
  # EXAMPLE ENUM — replace with your vocabulary
  # -------------------------------------------------------------------------
  MyVocabularyTerms:

    description: >-
      [Description of this concept scheme — what does it cover?]
      Full vocabulary published at
      https://w3id.org/chemical-exposome/vocabulary/my-vocabulary

    # Link to the full SKOS vocabulary
    see_also:
      - https://w3id.org/chemical-exposome/vocabulary/my-vocabulary

    permissible_values:

      # --- TOP-LEVEL CONCEPT (no is_a = top concept in hierarchy) ---
      TopConcept:
        description: >-
          [Definition of this top-level concept. Be precise and unambiguous.]
        aliases:
          - Alternative name 1
          - Alternative name 2
        comments:
          - >-
            [Scope note — when and how to use this concept.
            What are the boundaries? What should NOT be used here instead?]
        # If this concept exists in an external vocabulary, use meaning:
        # meaning: https://external-vocab.org/TopConcept
        # If you mint your own URI and map to external, use exact_mappings:
        # exact_mappings:
        #   - https://external-vocab.org/SimilarConcept

      # --- MID-LEVEL CONCEPT (is_a = has a parent) ---
      MidLevelConcept:
        is_a: TopConcept                    # → skos:broader TopConcept
        description: >-
          [Definition of this mid-level concept.]
        aliases:
          - Alternative name
        comments:
          - >-
            [Scope note — clarify when to use this vs sibling concepts.]
        # meaning: https://external-vocab.org/MidLevelConcept

      # --- LEAF CONCEPT (most specific, no children) ---
      LeafConceptA:
        is_a: MidLevelConcept               # → skos:broader MidLevelConcept
        description: >-
          [Definition of this specific concept.]
        aliases:
          - Alternative name A
        comments:
          - >-
            [Scope note — when to use this specific concept.]
        # meaning: https://external-vocab.org/LeafConceptA

      LeafConceptB:
        is_a: MidLevelConcept               # → skos:broader MidLevelConcept
        description: >-
          [Definition of this concept.]
        aliases:
          - Alternative name B
        # meaning: https://external-vocab.org/LeafConceptB

      # --- ANOTHER TOP-LEVEL CONCEPT ---
      AnotherTopConcept:
        description: >-
          [Definition of another top-level concept in the same scheme.]
        # meaning: https://external-vocab.org/AnotherTopConcept

      ChildOfAnotherTop:
        is_a: AnotherTopConcept
        description: >-
          [Definition.]
        # meaning: https://external-vocab.org/ChildOfAnotherTop
