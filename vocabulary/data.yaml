# ===========================================================================
# ANALYTICAL METHODS VOCABULARY
# ===========================================================================
# Controlled vocabulary of analytical methods used for chemical analysis
# in environmental monitoring data.
# Based on PARC WP9 deliverable D9.4-1.
# ===========================================================================

id: https://w3id.org/chemical-exposome/vocabulary/analytical-methods
name: analytical-methods-vocabulary
title: Analytical Methods Vocabulary
description: >-
  Controlled vocabulary of analytical methods used for chemical analysis
  in environmental monitoring samples. Covers spectroscopy, mass spectrometry,
  chromatography, mixed methods and other analytical techniques.
  Developed within the PARC (Partnership for the Assessment of Risks from
  Chemicals) project, aligned with PARC deliverable D9.4-1.
version: "2.1.0"
license: https://creativecommons.org/licenses/by/4.0/
created_by: https://orcid.org/0000-0003-0222-801x
created_on: "2026-07-30T00:00:00Z"
last_updated_on: "2026-07-30T00:00:00Z"
modified_by: https://orcid.org/0000-0003-0222-801x

comments:
  - >-
    CRediT contributor roles (https://credit.niso.org/contributor-roles/):
    Conceptualization: Katarína Řiháčková (https://orcid.org/0000-0003-0222-801x);
    Data curation: Katarína Řiháčková (https://orcid.org/0000-0003-0222-801x)
  - >-
    Version 2.1 changes from v2.0: Structural corrections — restored missing
    Atomic Emission Spectroscopy (AES) parent class; removed GC-HRMS sector
    (full name unverified) and HPLC-Decomposition-HGAAS (full name unverified);
    ICP-AES and ICP-OES kept as sister methods pending verification.
    NOTE: ICP-AES and ICP-OES are widely considered synonyms —
    ICP-OES preferred as unambiguous; ICP-AES avoided due to conflict with
    Auger Electron Spectroscopy acronym — to be verified against PARC D9.4-1.

see_also:
  - https://www.parc-project.eu

