# ===========================================================================
# ANALYTICAL METHODS VOCABULARY
# ===========================================================================
# Controlled vocabulary of analytical methods used for chemical analysis
# in environmental monitoring data.
# Based on PARC WP9 deliverable D9.4-1.
# ===========================================================================

id: https://w3id.org/chemical-exposome/vocabulary/analytical-methods
name: analytical-methods-vocabulary
title: Analytical Methods Vocabulary
description: >-
  Controlled vocabulary of analytical methods used for chemical analysis
  in environmental monitoring samples. Covers spectroscopy, mass spectrometry,
  chromatography, mixed methods and other analytical techniques.
  Developed within the PARC (Partnership for the Assessment of Risks from
  Chemicals) project, aligned with PARC deliverable D9.4-1.
version: "2.1.0"
license: https://creativecommons.org/licenses/by/4.0/
created_by: https://orcid.org/0000-0003-0222-801x
created_on: "2026-07-30T00:00:00Z"
last_updated_on: "2026-07-30T00:00:00Z"
modified_by: https://orcid.org/0000-0003-0222-801x

comments:
  - >-
    CRediT contributor roles (https://credit.niso.org/contributor-roles/):
    Conceptualization: Katarína Řiháčková (https://orcid.org/0000-0003-0222-801x);
    Data curation: Katarína Řiháčková (https://orcid.org/0000-0003-0222-801x)
  - >-
    Version 2.1 changes from v2.0: Structural corrections — restored missing
    Atomic Emission Spectroscopy (AES) parent class; removed GC-HRMS sector
    (full name unverified) and HPLC-Decomposition-HGAAS (full name unverified);
    ICP-AES and ICP-OES kept as sister methods pending verification.
    NOTE: ICP-AES and ICP-OES are widely considered synonyms —
    ICP-OES preferred as unambiguous; ICP-AES avoided due to conflict with
    Auger Electron Spectroscopy acronym — to be verified against PARC D9.4-1.

see_also:
  - https://www.parc-project.eu

annotations:
  schema_status:
    tag: schema_status
    value: draft

  repo_url:
    tag: repo_url
    value: https://github.com/KatarinaRi/vocab_analyticalMethods

  funding:
    tag: funding
    value: >-
      This work was supported by the European Partnership for the Assessment
      of Risks from Chemicals (PARC) under Horizon Europe grant agreement
      No 101057014.

prefixes:
  linkml: https://w3id.org/linkml/
  cenvo: https://w3id.org/chemical-exposome/terms/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: cenvo

imports:
  - linkml:types

enums:

  AnalyticalMethod:
    description: >-
      Controlled vocabulary of analytical methods used for chemical analysis
      in environmental monitoring samples. Full vocabulary published at
      https://w3id.org/chemical-exposome/vocabulary/analytical-methods
    see_also:
      - https://w3id.org/chemical-exposome/vocabulary/analytical-methods

    permissible_values:

      # -----------------------------------------------------------------------
      # TOP LEVEL
      # -----------------------------------------------------------------------

      AnalyticalMethod:
        description: >-
          Any method used for the chemical analysis of environmental samples.
          Top-level concept encompassing all analytical techniques.

      Spectroscopy:
        is_a: AnalyticalMethod
        description: >-
          Analytical methods based on the interaction of matter with
          electromagnetic radiation to identify and quantify chemical substances.
        aliases:
          - Spectroscopic methods

      MassSpectrometry:
        is_a: AnalyticalMethod
        description: >-
          Analytical methods based on the measurement of mass-to-charge ratios
          of ions to identify and quantify chemical substances.
        aliases:
          - MS methods

      Chromatography:
        is_a: AnalyticalMethod
        description: >-
          Analytical methods based on the separation of chemical mixtures
          by differential migration through a stationary phase.
        aliases:
          - Chromatographic methods

      MixedMethods:
        is_a: AnalyticalMethod
        description: >-
          Analytical methods combining chromatographic separation with
          spectroscopic or mass spectrometric detection.
        aliases:
          - Hyphenated methods
          - Coupled methods

      Other:
        is_a: AnalyticalMethod
        description: >-
          Analytical methods that do not fit within Spectroscopy, Mass
          Spectrometry, Chromatography, or Mixed Methods categories.

      # -----------------------------------------------------------------------
      # SPECTROSCOPY
      # -----------------------------------------------------------------------

      # Atomic Absorption Spectroscopy
      AAS:
        is_a: Spectroscopy
        description: >-
          Atomic Absorption Spectroscopy — a technique for measuring
          concentrations of elements by measuring the absorption of light
          by free atoms in the gaseous state.
        aliases:
          - Atomic Absorption Spectroscopy

      DirectAAS:
        is_a: AAS
        description: >-
          Direct Atomic Absorption Spectroscopy — direct measurement without
          prior separation or generation steps.
        aliases:
          - Direct AAS

      FlameAAS:
        is_a: AAS
        description: >-
          Flame Atomic Absorption Spectroscopy — sample is aspirated into
          a flame to produce free atoms for measurement.
        aliases:
          - Flame AAS
          - FAAS

      GFAAS:
        is_a: AAS
        description: >-
          Graphite Furnace Atomic Absorption Spectroscopy — uses a graphite
          furnace to atomise the sample, providing higher sensitivity than
          flame AAS.
        aliases:
          - Graphite Furnace AAS
          - GF-AAS
          - ETAAS
          - Electrothermal AAS
        comments:
          - Included in PARC deliverable D9.4-1

      CVAAS:
        is_a: AAS
        description: >-
          Cold Vapour Atomic Absorption Spectroscopy — used for mercury
          determination; mercury vapour is generated and swept into the
          light path for measurement.
        aliases:
          - Cold Vapour AAS
          - CV-AAS
        comments:
          - Included in PARC deliverable D9.4-1

      TDAAS:
        is_a: AAS
        description: >-
          Thermal Decomposition Atomic Absorption Spectroscopy — the sample
          is thermally decomposed before atomic absorption measurement.
        aliases:
          - Thermal Decomposition AAS
          - TD-AAS

      AdvancedMercuryAnalyzer:
        is_a: AAS
        description: >-
          Advanced Mercury Analyzer — instrument dedicated to mercury
          determination using thermal decomposition and atomic absorption.
        aliases:
          - AMA

      DirectMercuryAnalyzer:
        is_a: AAS
        description: >-
          Direct Mercury Analyzer — instrument for direct mercury determination
          in solid and liquid samples without prior digestion.
        aliases:
          - DMA

      # Atomic Emission Spectroscopy
      AES:
        is_a: Spectroscopy
        description: >-
          Atomic Emission Spectroscopy — a technique that uses the emission
          of light by excited atoms to identify and quantify elements.
        aliases:
          - Atomic Emission Spectroscopy

      DirectAES:
        is_a: AES
        description: >-
          Direct Atomic Emission Spectroscopy — direct measurement without
          prior separation or generation steps.
        aliases:
          - Direct AES

      FlameAES:
        is_a: AES
        description: >-
          Flame Atomic Emission Spectroscopy — uses a flame to excite atoms
          which then emit characteristic radiation.
        aliases:
          - Flame AES

      PlasmaAES:
        is_a: AES
        description: >-
          Plasma Atomic Emission Spectroscopy — uses a plasma source to
          excite atoms for emission measurement.
        aliases:
          - Plasma AES

      GDAES:
        is_a: AES
        description: >-
          Glow Discharge Atomic Emission Spectroscopy — uses a glow discharge
          plasma to atomise and excite the sample.
        aliases:
          - Glow Discharge AES
          - GD-AES

      # Atomic Fluorescence Spectroscopy
      AFS:
        is_a: Spectroscopy
        description: >-
          Atomic Fluorescence Spectroscopy — measures the fluorescence emitted
          by atoms excited by a light source; highly sensitive for trace
          element determination.
        aliases:
          - Atomic Fluorescence Spectroscopy

      DirectAFS:
        is_a: AFS
        description: >-
          Direct Atomic Fluorescence Spectroscopy — direct measurement without
          prior separation or generation steps.
        aliases:
          - Direct AFS

      HGAFS:
        is_a: AFS
        description: >-
          Hydride Generation Atomic Fluorescence Spectroscopy — volatile
          hydrides of the analyte are generated and introduced into the
          fluorescence detector.
        aliases:
          - Hydride Generation AFS
          - HG-AFS

      FIAFS:
        is_a: AFS
        description: >-
          Flow Injection Atomic Fluorescence Spectroscopy — flow injection
          analysis coupled with atomic fluorescence spectroscopy.
        aliases:
          - Flow Injection AFS
          - FI-AFS

      CVAFS:
        is_a: AFS
        description: >-
          Cold Vapour Atomic Fluorescence Spectroscopy — used for mercury
          determination; mercury vapour is generated and measured by
          fluorescence.
        aliases:
          - Cold Vapour AFS
          - CV-AFS

      # ICP Spectroscopy
      ICP:
        is_a: Spectroscopy
        description: >-
          Inductively Coupled Plasma Spectroscopy — uses an inductively
          coupled plasma to atomise and excite or ionise the sample for
          elemental analysis.
        aliases:
          - Inductively Coupled Plasma Spectroscopy

      ICPAES:
        is_a: ICP
        description: >-
          ICP Atomic Emission Spectroscopy — measures atomic emission from
          an ICP source. NOTE: widely considered a synonym of ICP-OES —
          to be verified against PARC D9.4-1. ICP-AES acronym may conflict
          with Auger Electron Spectroscopy.
        aliases:
          - ICP-AES
          - ICP Atomic Emission Spectroscopy
        comments:
          - >-
            ICP-AES and ICP-OES are widely considered synonyms.
            ICP-OES is preferred as unambiguous. ICP-AES acronym may conflict
            with Auger Electron Spectroscopy. Status to be verified against
            PARC D9.4-1.

      ICPOES:
        is_a: ICP
        description: >-
          ICP Optical Emission Spectroscopy — measures optical emission from
          an ICP source. NOTE: widely considered a synonym of ICP-AES —
          to be verified against PARC D9.4-1. ICP-OES is the preferred
          unambiguous acronym.
        aliases:
          - ICP-OES
          - ICP Optical Emission Spectroscopy
        comments:
          - >-
            ICP-OES is the preferred unambiguous acronym. ICP-AES and ICP-OES
            are widely considered synonyms. Status to be verified against
            PARC D9.4-1.

      # X-ray Fluorescence
      XRF:
        is_a: Spectroscopy
        description: >-
          X-ray Fluorescence Spectroscopy — uses X-ray excitation to produce
          characteristic fluorescent X-rays from elements in the sample.
        aliases:
          - X-ray Fluorescence Spectroscopy

      EDXRF:
        is_a: XRF
        description: >-
          Energy-Dispersive X-ray Fluorescence Spectroscopy — separates
          fluorescent X-rays by energy using a semiconductor detector.
        aliases:
          - Energy-Dispersive XRF
          - ED-XRF

      WDXRF:
        is_a: XRF
        description: >-
          Wavelength-Dispersive X-ray Fluorescence Spectroscopy — separates
          fluorescent X-rays by wavelength using a crystal diffractometer.
        aliases:
          - Wavelength-Dispersive XRF
          - WD-XRF

      TXRF:
        is_a: XRF
        description: >-
          Total Reflection X-ray Fluorescence Spectroscopy — uses total
          external reflection geometry to reduce background and improve
          detection limits.
        aliases:
          - Total Reflection XRF
          - TXRF

      # NMR
      NMR:
        is_a: Spectroscopy
        description: >-
          Nuclear Magnetic Resonance Spectroscopy — uses the magnetic
          properties of atomic nuclei to determine molecular structure
          and composition.
        aliases:
          - Nuclear Magnetic Resonance Spectroscopy

      H1NMR:
        is_a: NMR
        description: >-
          Proton Nuclear Magnetic Resonance Spectroscopy — measures the
          NMR signal from hydrogen-1 nuclei.
        aliases:
          - Proton NMR
          - 1H NMR

      C13NMR:
        is_a: NMR
        description: >-
          Carbon-13 Nuclear Magnetic Resonance Spectroscopy — measures the
          NMR signal from carbon-13 nuclei.
        aliases:
          - Carbon-13 NMR
          - 13C NMR

      # UV-Vis
      UVVis:
        is_a: Spectroscopy
        description: >-
          UV-Visible Spectroscopy — measures absorption of ultraviolet and
          visible light by molecules in solution.
        aliases:
          - UV-Visible Spectroscopy
          - UV-Vis

      SingleWavelengthUVVis:
        is_a: UVVis
        description: >-
          Single Wavelength UV-Visible Spectroscopy — measurement at a
          single fixed wavelength.
        aliases:
          - Single Wavelength UV-Vis

      DADUVVis:
        is_a: UVVis
        description: >-
          Multi-Wavelength UV-Visible Spectroscopy with Diode Array Detection —
          simultaneous measurement across a range of wavelengths using a
          diode array detector.
        aliases:
          - DAD UV-Vis
          - Diode Array Detection UV-Vis

      # -----------------------------------------------------------------------
      # MASS SPECTROMETRY
      # -----------------------------------------------------------------------

      # ICP-MS
      ICPMS:
        is_a: MassSpectrometry
        description: >-
          ICP Mass Spectrometry — uses an inductively coupled plasma to
          ionise the sample, with mass spectrometric detection for elemental
          and isotopic analysis.
        aliases:
          - ICP-MS
          - Inductively Coupled Plasma Mass Spectrometry

      ICPMSMS:
        is_a: ICPMS
        description: >-
          ICP Tandem Mass Spectrometry — uses two mass analysers in series
          to reduce spectral interferences.
        aliases:
          - ICP-MS/MS
          - ICP Tandem Mass Spectrometry

      ICPDRCMS:
        is_a: ICPMS
        description: >-
          ICP Dynamic Reaction Cell Mass Spectrometry — uses a reaction cell
          filled with a reactive gas to eliminate spectral interferences.
        aliases:
          - ICP-DRC-MS
          - ICP Dynamic Reaction Cell MS

      ICPKEDMS:
        is_a: ICPMS
        description: >-
          ICP Kinetic Energy Discrimination Mass Spectrometry — uses a
          collision cell with kinetic energy discrimination to reduce
          polyatomic interferences.
        aliases:
          - ICP-KED-MS
          - ICP Kinetic Energy Discrimination MS

      # GC-MS
      GCMS:
        is_a: MassSpectrometry
        description: >-
          Gas Chromatography – Mass Spectrometry — combines gas chromatographic
          separation with mass spectrometric detection.
        aliases:
          - GC-MS
          - Gas Chromatography Mass Spectrometry

      GCMSMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Tandem Mass Spectrometry — uses two mass
          analysers in series after gas chromatographic separation.
        aliases:
          - GC-MS/MS
          - GC Tandem MS

      GCHRMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – High Resolution Mass Spectrometry — uses a
          high resolution mass analyser after gas chromatographic separation.
        aliases:
          - GC-HRMS
          - GC High Resolution MS

      GCHRMSMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – High Resolution Tandem Mass Spectrometry.
        aliases:
          - GC-HRMS/MS

      GCEIMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Electron Ionisation Mass Spectrometry — uses
          electron ionisation as the ionisation technique.
        aliases:
          - GC-EI-MS

      GCEIMSMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Electron Ionisation Tandem Mass Spectrometry.
        aliases:
          - GC-EI-MS/MS

      GCEIHMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Electron Ionisation High Resolution Mass
          Spectrometry.
        aliases:
          - GC-EI-HRMS

      GCEIHRMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Electron Ionisation High Resolution Tandem
          Mass Spectrometry.
        aliases:
          - GC-EI-HRMS/MS

      GCNCIMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Negative Chemical Ionisation Mass Spectrometry.
        aliases:
          - GC-NCI-MS

      GCNCIMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Negative Chemical Ionisation Tandem Mass
          Spectrometry.
        aliases:
          - GC-NCI-MS/MS

      GCNCIHRMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Negative Chemical Ionisation High Resolution
          Mass Spectrometry.
        aliases:
          - GC-NCI-HRMS

      GCNCIHRMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Negative Chemical Ionisation High Resolution
          Tandem Mass Spectrometry.
        aliases:
          - GC-NCI-HRMS/MS

      GCCIMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Chemical Ionisation Mass Spectrometry.
        aliases:
          - GC-CI-MS

      GCCIMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Chemical Ionisation Tandem Mass Spectrometry.
        aliases:
          - GC-CI-MS/MS

      GCCIHRMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Chemical Ionisation High Resolution Mass
          Spectrometry.
        aliases:
          - GC-CI-HRMS

      GCCIHRMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Chemical Ionisation High Resolution Tandem
          Mass Spectrometry.
        aliases:
          - GC-CI-HRMS/MS

      GCAPPIMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Photoionisation Mass
          Spectrometry.
        aliases:
          - GC-APPI-MS

      GCAPPIMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Photoionisation Tandem
          Mass Spectrometry.
        aliases:
          - GC-APPI-MS/MS

      GCAPPIHRMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Photoionisation High
          Resolution Mass Spectrometry.
        aliases:
          - GC-APPI-HRMS

      GCAPPIHRMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Photoionisation High
          Resolution Tandem Mass Spectrometry.
        aliases:
          - GC-APPI-HRMS/MS

      GCAPCIMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Chemical Ionisation Mass
          Spectrometry.
        aliases:
          - GC-APCI-MS

      GCAPCIMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Chemical Ionisation Tandem
          Mass Spectrometry.
        aliases:
          - GC-APCI-MS/MS

      GCAPCIHRMS:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Chemical Ionisation High
          Resolution Mass Spectrometry.
        aliases:
          - GC-APCI-HRMS

      GCAPCIHRMSMSt:
        is_a: GCMS
        description: >-
          Gas Chromatography – Atmospheric Pressure Chemical Ionisation High
          Resolution Tandem Mass Spectrometry.
        aliases:
          - GC-APCI-HRMS/MS

      GCxGCMS:
        is_a: GCMS
        description: >-
          Comprehensive Two-Dimensional Gas Chromatography – Mass Spectrometry —
          uses two GC columns with different selectivities in series.
        aliases:
          - GCxGC-MS
          - GC×GC-MS
          - Two-Dimensional GC-MS

      GCxGCMSMSt:
        is_a: GCMS
        description: >-
          Comprehensive Two-Dimensional Gas Chromatography – Tandem Mass
          Spectrometry.
        aliases:
          - GCxGC-MS/MS
          - GC×GC-MS/MS

      GCxGCHRMS:
        is_a: GCMS
        description: >-
          Comprehensive Two-Dimensional Gas Chromatography – High Resolution
          Mass Spectrometry.
        aliases:
          - GCxGC-HRMS
          - GC×GC-HRMS

      # LC-MS
      LCMS:
        is_a: MassSpectrometry
        description: >-
          Liquid Chromatography – Mass Spectrometry — combines liquid
          chromatographic separation with mass spectrometric detection.
        aliases:
          - LC-MS
          - Liquid Chromatography Mass Spectrometry

      LCMSMSt:
        is_a: LCMS
        description: >-
          Liquid Chromatography – Tandem Mass Spectrometry.
        aliases:
          - LC-MS/MS

      LCHRMS:
        is_a: LCMS
        description: >-
          Liquid Chromatography – High Resolution Mass Spectrometry.
        aliases:
          - LC-HRMS

      LCHRMSMSt:
        is_a: LCMS
        description: >-
          Liquid Chromatography – High Resolution Tandem Mass Spectrometry.
        aliases:
          - LC-HRMS/MS

      HPLCMS:
        is_a: LCMS
        description: >-
          High Performance Liquid Chromatography – Mass Spectrometry.
        aliases:
          - HPLC-MS

      HPLCMSMSt:
        is_a: LCMS
        description: >-
          High Performance Liquid Chromatography – Tandem Mass Spectrometry.
        aliases:
          - HPLC-MS/MS

      HPLCHRMS:
        is_a: LCMS
        description: >-
          High Performance Liquid Chromatography – High Resolution Mass
          Spectrometry.
        aliases:
          - HPLC-HRMS

      HPLCHRMSMSt:
        is_a: LCMS
        description: >-
          High Performance Liquid Chromatography – High Resolution Tandem
          Mass Spectrometry.
        aliases:
          - HPLC-HRMS/MS

      HPLCECD:
        is_a: LCMS
        description: >-
          High Performance Liquid Chromatography – Electrochemical Detection.
        aliases:
          - HPLC-ECD
          - HPLC Electrochemical Detection
        comments:
          - Included in PARC deliverable D9.4-1

      UPLCMS:
        is_a: LCMS
        description: >-
          Ultra Performance Liquid Chromatography – Mass Spectrometry.
        aliases:
          - UPLC-MS

      UPLCMSMSt:
        is_a: LCMS
        description: >-
          Ultra Performance Liquid Chromatography – Tandem Mass Spectrometry.
        aliases:
          - UPLC-MS/MS

      UPLCHRMS:
        is_a: LCMS
        description: >-
          Ultra Performance Liquid Chromatography – High Resolution Mass
          Spectrometry.
        aliases:
          - UPLC-HRMS

      UPLCHRMSMSt:
        is_a: LCMS
        description: >-
          Ultra Performance Liquid Chromatography – High Resolution Tandem
          Mass Spectrometry.
        aliases:
          - UPLC-HRMS/MS

      # IC-MS
      ICMS:
        is_a: MassSpectrometry
        description: >-
          Ion Chromatography – Mass Spectrometry — combines ion chromatographic
          separation with mass spectrometric detection.
        aliases:
          - IC-MS
          - Ion Chromatography Mass Spectrometry

      ICMSMSt:
        is_a: ICMS
        description: >-
          Ion Chromatography – Tandem Mass Spectrometry.
        aliases:
          - IC-MS/MS

      ICHRMS:
        is_a: ICMS
        description: >-
          Ion Chromatography – High Resolution Mass Spectrometry.
        aliases:
          - IC-HRMS

      ICHRMSMSt:
        is_a: ICMS
        description: >-
          Ion Chromatography – High Resolution Tandem Mass Spectrometry.
        aliases:
          - IC-HRMS/MS

      ICESIMS:
        is_a: ICMS
        description: >-
          Ion Chromatography – Electrospray Ionisation Mass Spectrometry.
        aliases:
          - IC-ESI-MS

      ICESIMSMSt:
        is_a: ICMS
        description: >-
          Ion Chromatography – Electrospray Ionisation Tandem Mass Spectrometry.
        aliases:
          - IC-ESI-MS/MS

      ICESIHRMS:
        is_a: ICMS
        description: >-
          Ion Chromatography – Electrospray Ionisation High Resolution Mass
          Spectrometry.
        aliases:
          - IC-ESI-HRMS

      ICESIHRMSMSt:
        is_a: ICMS
        description: >-
          Ion Chromatography – Electrospray Ionisation High Resolution Tandem
          Mass Spectrometry.
        aliases:
          - IC-ESI-HRMS/MS

      # SFC-MS
      SFCMS:
        is_a: MassSpectrometry
        description: >-
          Supercritical Fluid Chromatography – Mass Spectrometry — uses
          supercritical fluid as the mobile phase with mass spectrometric
          detection.
        aliases:
          - SFC-MS
          - Supercritical Fluid Chromatography Mass Spectrometry

      SFCMSMSt:
        is_a: SFCMS
        description: >-
          Supercritical Fluid Chromatography – Tandem Mass Spectrometry.
        aliases:
          - SFC-MS/MS

      SFCHRMS:
        is_a: SFCMS
        description: >-
          Supercritical Fluid Chromatography – High Resolution Mass
          Spectrometry.
        aliases:
          - SFC-HRMS

      SFCHRMSMSt:
        is_a: SFCMS
        description: >-
          Supercritical Fluid Chromatography – High Resolution Tandem Mass
          Spectrometry.
        aliases:
          - SFC-HRMS/MS

      # -----------------------------------------------------------------------
      # CHROMATOGRAPHY
      # -----------------------------------------------------------------------

      # Liquid Chromatography
      LC:
        is_a: Chromatography
        description: >-
          Liquid Chromatography — separation technique using a liquid mobile
          phase passing through a stationary phase.
        aliases:
          - Liquid Chromatography

      LCDAD:
        is_a: LC
        description: >-
          Liquid Chromatography – Diode Array Detection.
        aliases:
          - LC-DAD

      LCFLD:
        is_a: LC
        description: >-
          Liquid Chromatography – Fluorescence Detection.
        aliases:
          - LC-FLD

      LCUV:
        is_a: LC
        description: >-
          Liquid Chromatography – Ultraviolet Detection.
        aliases:
          - LC-UV

      LCVIS:
        is_a: LC
        description: >-
          Liquid Chromatography – Visible Detection.
        aliases:
          - LC-VIS
        comments:
          - Included in PARC deliverable D9.4-1

      # HPLC
      HPLC:
        is_a: LC
        description: >-
          High Performance Liquid Chromatography — liquid chromatography
          using high pressure to force the mobile phase through a tightly
          packed stationary phase column.
        aliases:
          - High Performance Liquid Chromatography
          - High Pressure Liquid Chromatography

      HPLCDAD:
        is_a: HPLC
        description: >-
          High Performance Liquid Chromatography – Diode Array Detection.
        aliases:
